# One capped development container. Deliberate boundaries:
#   * publishes on loopback only — nothing reaches it from the network by default
#   * no host networking, no docker socket, no production mounts or host SSH keys
#   * project-scoped deploy keys may be generated inside the private data volume
#   * non-root user, all capabilities dropped, no-new-privileges, read-only root
#   * hard CPU / memory / PID limits and rotated logs
name: pi-workspace-pilot

services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/pilot/Dockerfile
    image: pi-workspace-pilot:local
    container_name: pi-workspace-pilot
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
          pids: 512
    ports:
      - "127.0.0.1:4319:4319"
    env_file:
      - .env
    volumes:
      - pilot-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${DASHBOARD_HEALTH_HOST}\" \"http://127.0.0.1:${PORT}/healthz\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated tunnel for this pilot hostname only. It reaches the app by service
  # name on this compose network, so the app never needs a host or public port.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: pi-workspace-pilot-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /etc/cloudflared/token
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - dashboard
    volumes:
      - ./tunnel-token:/etc/cloudflared/token:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pilot-data:
